name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # Windsock is a WPF application that reaches into Windows directly. It can
    # only be built, and its tests can only be run, on Windows.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The full edition: per-process rates and processor temperature.
          - edition: full
            store: "false"
          # The Store edition, built without them rather than with them turned
          # off - the packages behind them are referenced conditionally, so
          # neither the trace session nor the driver is in the output at all.
          - edition: store
            store: "true"

    name: build (${{ matrix.edition }})

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # The version is stated once, in global.json, rather than twice.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Separate from the build so that a dependency problem - an unreachable
      # feed, or the vulnerability audit failing the restore - is reported as
      # what it is rather than as code that would not compile.
      - name: Restore
        run: dotnet restore Windsock.slnx

      - name: Build
        # Warnings are errors for every project in this repository, so this step
        # is also the style and analyser gate. Both editions go through it,
        # which is the point of the matrix: a change that compiles in one and
        # not the other is caught here rather than at release time.
        run: dotnet build Windsock.slnx --configuration Release --no-restore -p:StoreBuild=${{ matrix.store }}

      - name: Test
        run: dotnet test Windsock.slnx --configuration Release --no-build -p:StoreBuild=${{ matrix.store }}

      - name: Publish
        run: >
          dotnet publish src/Windsock.App/Windsock.App.csproj
          --configuration Release
          --no-build
          -p:StoreBuild=${{ matrix.store }}
          --output artifacts/Windsock-${{ matrix.edition }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Windsock-${{ matrix.edition }}
          path: artifacts/Windsock-${{ matrix.edition }}
          if-no-files-found: error
